<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C28H Panel</title>
    
    <style>
        /* CSS MÀN HÌNH KHÓA BẢO MẬT */
        #key-lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0d0d11;
            color: #ffffff;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .lock-card {
            background: #16161e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #2a2a3a;
        }

        .lock-card h2 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .lock-card p {
            font-size: 13px;
            color: #a0a0b0;
            margin-bottom: 15px;
        }

        .lock-card input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a4c;
            background: #0d0d11;
            color: #00ffcc;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            box-sizing: border-box;
        }

        .lock-card button {
            width: 90%;
            padding: 12px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
        }

        .lock-card button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        #key-error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- ======================================================= -->
    <!-- 1. MÀN HÌNH KHÓA KEY (TỰ ĐỘNG ẨN KHI NHẬP ĐÚNG KEY)       -->
    <!-- ======================================================= -->
    <div id="key-lock-screen">
        <div class="lock-card">
            <h2>C28H PANEL</h2>
            <p>Vui lòng nhập Key để mở ứng dụng</p>
            <input type="text" id="user-key-input" placeholder="c28hstore-key..." autocomplete="off" spellcheck="false">
            <button onclick="validateKey()">KÍCH HOẠT</button>
            <div id="key-error-msg"></div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 2. KHU VỰC GIAO DIỆN PANEL GỐC CỦA BẠN                   -->
    <!-- ======================================================= -->
    <div id="main-app-content">

        <!-- BẠN DÁN CODE HTML PANEL AIMLOCK GỐC VÀO ĐÂY -->

    </div>

    <!-- ======================================================= -->
    <!-- 3. BỘ XÁC THỰC VÀ LIÊN KẾT KEY TỰ ĐỘNG                    -->
    <!-- ======================================================= -->
    <script>
        // Bảng quy định thời gian sống của từng loại Key (tính bằng Giây)
        const KEY_DURATIONS = {
            'keygio': 3600,         // 1 Giờ
            'keyngay': 86400,       // 24 Giờ
            'keytuan': 604800,      // 7 Ngày
            'keythang': 2592000,    // 30 Ngày
            'keyvv': 3153600000     // Vĩnh Viễn (100 Năm)
        };

        // Thuật toán kiểm tra Key hợp lệ được xuất từ web getkey.html
        function verifyKeyFormat(key) {
            const formattedKey = key.trim().toLowerCase();
            // Cú pháp chuẩn: c28hstore-(loại key)-(5 ký tự ngẫu nhiên)
            const regex = /^c28hstore-(keygio|keyngay|keytuan|keythang|keyvv)-([a-z0-9]{5})$/;
            const match = formattedKey.match(regex);

            if (match) {
                const keyType = match[1];
                return KEY_DURATIONS[keyType] || null;
            }
            return null;
        }

        // Kiểm tra xem máy đã lưu Key hợp lệ và còn thời hạn hay không
        function checkAppLockState() {
            const expiryTime = localStorage.getItem("c28h_panel_key_expiry");
            
            if (expiryTime) {
                if (Date.now() > parseInt(expiryTime)) {
                    // Khi hết thời gian: Tự động xóa Key và khóa ứng dụng lại
                    localStorage.removeItem("c28h_panel_key_expiry");
                    document.getElementById("key-error-msg").innerText = "Key của bạn đã hết hạn!";
                    document.getElementById("key-lock-screen").style.display = "flex";
                } else {
                    // Mở giao diện Panel cho người dùng thao tác
                    document.getElementById("key-lock-screen").style.display = "none";
                }
            } else {
                // Chưa kích hoạt: Bắt buộc hiện màn hình khóa
                document.getElementById("key-lock-screen").style.display = "flex";
            }
        }

        // Xử lý khi nhấn nút KÍCH HOẠT
        function validateKey() {
            const inputKey = document.getElementById("user-key-input").value;
            const errorElement = document.getElementById("key-error-msg");
            
            const durationInSeconds = verifyKeyFormat(inputKey);

            if (durationInSeconds) {
                // Tính thời điểm hết hạn và lưu vào hệ thống thiết bị
                const expiryTimestamp = Date.now() + (durationInSeconds * 1000);
                localStorage.setItem("c28h_panel_key_expiry", expiryTimestamp);
                
                errorElement.innerText = "";
                // Mở khóa ứng dụng ngay lập tức
                document.getElementById("key-lock-screen").style.display = "none";
            } else {
                // Nhập sai hoặc không đúng cấu trúc
                errorElement.innerText = "Key sai hoặc không tồn tại!";
            }
        }

        // Kiểm tra trạng thái ngay khi khởi chạy WebClip
        checkAppLockState();

        // Kiểm tra định kỳ mỗi 5 giây (Tự động out nếu hết giờ khi đang dùng)
        setInterval(checkAppLockState, 5000);
    </script>
</body>
</html>
