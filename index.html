<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C28H Panel</title>
    
    <style>
        /* ======================================================= */
        /* STYLES DÀNH RIÊNG CHO MÀN HÌNH KHÓA KEY (THÊM MỚI)       */
        /* ======================================================= */
        #key-lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0d0d0d;
            color: #ffffff;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .lock-card {
            background: #1a1a1a;
            padding: 30px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 1px solid #333;
        }

        .lock-card h2 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 22px;
        }

        .lock-card input {
            width: 90%;
            padding: 12px;
            margin: 15px 0;
            border-radius: 6px;
            border: 1px solid #444;
            background: #252525;
            color: #fff;
            text-align: center;
            font-size: 15px;
            outline: none;
        }

        .lock-card button {
            width: 90%;
            padding: 12px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
        }

        .lock-card button:active {
            opacity: 0.8;
        }

        #key-error-msg {
            color: #ff4d4d;
            font-size: 14px;
            margin-top: 12px;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <!-- ======================================================= -->
    <!-- 1. MÀN HÌNH KHÓA KEY (THÊM MỚI)                          -->
    <!-- ======================================================= -->
    <div id="key-lock-screen">
        <div class="lock-card">
            <h2>C28H Panel</h2>
            <p style="font-size: 14px; color: #aaa; margin-bottom: 5px;">Yêu cầu kích hoạt Key để tiếp tục</p>
            <input type="text" id="user-key-input" placeholder="Nhập Key tại đây..." autocomplete="off" spellcheck="false">
            <button onclick="validateKey()">KÍCH HOẠT</button>
            <div id="key-error-msg"></div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 2. NỘI DUNG GỐC TRANG WEB CỦA BẠN (GIỮ NGUYÊN 100%)       -->
    <!-- (Bạn có thể dán toàn bộ code body gốc của bạn vào dưới dòng này) -->
    <!-- ======================================================= -->

    


    <!-- ======================================================= -->
    <!-- 3. HỆ THỐNG XỬ LÝ CHECK KEY & THỜI GIAN (THÊM MỚI)       -->
    <!-- ======================================================= -->
    <script>
        // Danh sách các Key hợp lệ và thời hạn (tính bằng Giây)
        const VALID_KEYS = {
            // Key Giờ (3600s = 1 Giờ)
            "c28hstore-keygio-a1b2c": 3600,
            "c28hstore-keygio-d3e4f": 3600,
            "c28hstore-keygio-g5h6i": 3600,

            // Key Ngày (86400s = 24 Giờ)
            "c28hstore-keyngay-j7k8l": 86400,
            "c28hstore-keyngay-m9n0p": 86400,
            "c28hstore-keyngay-q1r2s": 86400,

            // Key Tuần (604800s = 7 Ngày)
            "c28hstore-keytuan-t3u4v": 604800,
            "c28hstore-keytuan-w5x6y": 604800,

            // Key Tháng (2592000s = 30 Ngày)
            "c28hstore-keythang-z7a8b": 2592000,
            "c28hstore-keythang-c9d0e": 2592000,

            // Key Vĩnh Viễn (3153600000s ~ 100 Năm)
            "c28hstore-keyvv-f1g2h": 3153600000,
            "c28hstore-keyvv-i3j4k": 3153600000
        };

        // Hàm kiểm tra thời hạn sử dụng của Key
        function checkExpiration() {
            const expiryTime = localStorage.getItem("c28h_key_expiry");
            if (expiryTime) {
                if (Date.now() > parseInt(expiryTime)) {
                    // Khi hết hạn -> Xóa lưu trữ & Bắt buộc khóa trang web lại
                    localStorage.removeItem("c28h_key_expiry");
                    document.getElementById("key-error-msg").innerText = "Key của bạn đã hết hạn!";
                    document.getElementById("key-lock-screen").style.display = "flex";
                } else {
                    // Key còn hạn -> Mở khóa trang web
                    document.getElementById("key-lock-screen").style.display = "none";
                }
            } else {
                // Chưa nhập key -> Mở màn hình khóa
                document.getElementById("key-lock-screen").style.display = "flex";
            }
        }

        // Hàm xử lý kích hoạt Key
        function validateKey() {
            const inputKey = document.getElementById("user-key-input").value.trim();
            const errorMsg = document.getElementById("key-error-msg");

            if (VALID_KEYS[inputKey]) {
                const durationInSeconds = VALID_KEYS[inputKey];
                const expiryTimestamp = Date.now() + (durationInSeconds * 1000);
                
                // Lưu thời gian hết hạn vào máy
                localStorage.setItem("c28h_key_expiry", expiryTimestamp);
                
                errorMsg.innerText = "";
                document.getElementById("key-lock-screen").style.display = "none";
            } else {
                errorMsg.innerText = "Key không chính xác!";
            }
        }

        // Thực thi kiểm tra ngay lập tức khi load trang
        checkExpiration();

        // Tự động kiểm tra mỗi 5 giây (khi vừa hết thời gian key sẽ lập tức tự out/khóa lại)
        setInterval(checkExpiration, 5000);
    </script>
</body>
</html>
