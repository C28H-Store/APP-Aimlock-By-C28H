<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C28H Panel</title>
    
    <style>
        /* ======================================================= */
        /* STYLES MÀN HÌNH KHÓA KEY & BẢO MẬT                       */
        /* ======================================================= */
        #key-lock-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #0d0d11;
            color: #ffffff;
            z-index: 9999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .lock-card {
            background: #16161e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #2a2a3a;
        }

        .lock-card h2 {
            margin-top: 0;
            color: #00ffcc;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .lock-card p {
            font-size: 13px;
            color: #a0a0b0;
            margin-bottom: 15px;
        }

        .lock-card input {
            width: 90%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #3a3a4c;
            background: #0d0d11;
            color: #00ffcc;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            outline: none;
        }

        .lock-card input::placeholder {
            color: #555566;
            font-weight: normal;
        }

        .lock-card button {
            width: 90%;
            padding: 12px;
            background: linear-gradient(135deg, #00c853, #00e676);
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(0, 230, 118, 0.3);
        }

        .lock-card button:active {
            opacity: 0.8;
            transform: scale(0.98);
        }

        #key-error-msg {
            color: #ff5252;
            font-size: 13px;
            margin-top: 12px;
            min-height: 18px;
            font-weight: 500;
        }

        .contact-admin {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #2a2a3a;
            font-size: 12px;
            color: #888899;
        }

        .contact-admin a {
            color: #00ffcc;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- ======================================================= -->
    <!-- 1. MÀN HÌNH KHÓA KEY (YÊU CẦU NHẬP KEY)                 -->
    <!-- ======================================================= -->
    <div id="key-lock-screen">
        <div class="lock-card">
            <h2>C28H PANEL</h2>
            <p>Vui lòng nhập Key để tiếp tục sử dụng</p>
            <input type="text" id="user-key-input" placeholder="c28hstore-key..." autocomplete="off" spellcheck="false">
            <button onclick="validateKey()">KÍCH HOẠT</button>
            <div id="key-error-msg"></div>
            
            <div class="contact-admin">
                Chưa có Key? Liên hệ Admin để lấy Key:<br>
                Zalo/Telegram: <b>C28H Store</b>
            </div>
        </div>
    </div>

    <!-- ======================================================= -->
    <!-- 2. NỘI DUNG GỐC TRANG WEB CỦA BẠN                       -->
    <!-- (Nếu bạn có thêm mã HTML giao diện panel, dán vào đây)   -->
    <!-- ======================================================= -->
    <div style="text-align: center; padding: 50px 20px; font-family: sans-serif;">
        <h1 style="color: #00ffcc;">C28H PANEL ACTIVATED</h1>
        <p>Chào mừng bạn đã vào thành công ứng dụng!</p>
    </div>


    <!-- ======================================================= -->
    <!-- 3. HỆ THỐNG KIỂM TRA & XÁC THỰC KEY TỰ ĐỘNG              -->
    <!-- ======================================================= -->
    <script>
        // Thời gian hiệu lực tính bằng Giây
        const DURATION_MAP = {
            'keygio': 3600,         // 1 Giờ
            'keyngay': 86400,       // 24 Giờ
            'keytuan': 604800,      // 7 Ngày
            'keythang': 2592000,    // 30 Ngày
            'keyvv': 3153600000     // 100 Năm
        };

        // Kiểm tra định dạng Key bằng Thuật toán
        function parseKey(keyStr) {
            const regex = /^c28hstore-(keygio|keyngay|keytuan|keythang|keyvv)-([a-z0-9]{5})$/i;
            const match = keyStr.match(regex);
            if (match) {
                const type = match[1].toLowerCase();
                return DURATION_MAP[type] || null;
            }
            return null;
        }

        // Kiểm tra hạn sử dụng của Key
        function checkExpiration() {
            const expiryTime = localStorage.getItem("c28h_key_expiry");
            if (expiryTime) {
                if (Date.now() > parseInt(expiryTime)) {
                    localStorage.removeItem("c28h_key_expiry");
                    document.getElementById("key-error-msg").innerText = "Key của bạn đã hết hạn!";
                    document.getElementById("key-lock-screen").style.display = "flex";
                } else {
                    document.getElementById("key-lock-screen").style.display = "none";
                }
            } else {
                document.getElementById("key-lock-screen").style.display = "flex";
            }
        }

        // Xử lý khi nhấn nút KÍCH HOẠT
        function validateKey() {
            const inputKey = document.getElementById("user-key-input").value.trim();
            const errorMsg = document.getElementById("key-error-msg");
            const duration = parseKey(inputKey);

            if (duration) {
                const expiryTimestamp = Date.now() + (duration * 1000);
                localStorage.setItem("c28h_key_expiry", expiryTimestamp);
                errorMsg.innerText = "";
                document.getElementById("key-lock-screen").style.display = "none";
            } else {
                errorMsg.innerText = "Key không hợp lệ hoặc sai cú pháp!";
            }
        }

        // Chạy kiểm tra ngay khi mở ứng dụng
        checkExpiration();

        // Tự động kiểm tra liên tục mỗi 5 giây (hết hạn sẽ tự thoát ra màn hình khóa)
        setInterval(checkExpiration, 5000);
    </script>
</body>
</html>
